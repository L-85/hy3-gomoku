<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="KaiTi, STKaiti, 'Songti SC', SimSun, serif">
  <rect width="720" height="420" fill="#ece5d8"/>

  <!-- 左侧菜单卡 -->
  <rect x="40" y="44" width="300" height="332" rx="16" fill="#fffdf8" fill-opacity="0.92" stroke="#bfae84" stroke-width="1"/>
  <!-- 角印 -->
  <rect x="300" y="56" width="26" height="26" rx="4" fill="#3f6b4f"/>
  <text x="313" y="75" font-size="15" fill="#fdf6ec" text-anchor="middle" font-weight="700">弈</text>

  <text x="190" y="100" font-size="34" font-weight="700" fill="#211c16" text-anchor="middle" letter-spacing="10">五子棋</text>
  <text x="190" y="122" font-size="11.5" fill="#4a4136" text-anchor="middle" letter-spacing="1">由 腾讯混元 Hy3 驱动 · 黑白纵横，落子成韵</text>
  <line x1="120" y1="134" x2="260" y2="134" stroke="#bfae84" stroke-width="1"/>

  <!-- 模式按钮 -->
  <rect x="64" y="150" width="252" height="44" rx="8" fill="#fff" stroke="#bfae84"/>
  <rect x="74" y="160" width="26" height="26" rx="5" fill="#fff" stroke="#3f6b4f" stroke-width="2"/>
  <text x="87" y="179" font-size="15" fill="#3f6b4f" text-anchor="middle" font-weight="700">对</text>
  <text x="118" y="177" font-size="15" fill="#211c16">双人对战</text>

  <rect x="64" y="202" width="252" height="44" rx="8" fill="#fff" stroke="#3f6b4f"/>
  <rect x="74" y="212" width="26" height="26" rx="5" fill="#3f6b4f"/>
  <text x="87" y="231" font-size="15" fill="#fdf6ec" text-anchor="middle" font-weight="700">弈</text>
  <text x="118" y="229" font-size="15" fill="#211c16">人机对战</text>

  <rect x="64" y="254" width="252" height="44" rx="8" fill="#fff" stroke="#bfae84"/>
  <rect x="74" y="264" width="26" height="26" rx="5" fill="#fff" stroke="#3f6b4f" stroke-width="2"/>
  <text x="87" y="283" font-size="15" fill="#3f6b4f" text-anchor="middle" font-weight="700">残</text>
  <text x="118" y="281" font-size="15" fill="#211c16">残局挑战</text>

  <!-- AI 难度 -->
  <text x="70" y="330" font-size="12" fill="#4a4136">AI 难度</text>
  <rect x="138" y="316" width="50" height="26" rx="8" fill="#fff" stroke="#bfae84"/>
  <text x="163" y="333" font-size="12" fill="#211c16" text-anchor="middle">初级</text>
  <rect x="193" y="316" width="50" height="26" rx="8" fill="#211c16"/>
  <text x="218" y="333" font-size="12" fill="#f6efe0" text-anchor="middle">中级</text>
  <rect x="248" y="316" width="50" height="26" rx="8" fill="#fff" stroke="#bfae84"/>
  <text x="273" y="333" font-size="12" fill="#211c16" text-anchor="middle">高级</text>

  <!-- 右侧棋盘 -->
  <rect x="370" y="40" width="320" height="320" rx="8" fill="#dcb67a" stroke="#b8954a"/>
  <g stroke="#8b6914" stroke-width="0.7">
    <line x1="386" y1="56" x2="674" y2="56"/><line x1="386" y1="88" x2="674" y2="88"/>
    <line x1="386" y1="120" x2="674" y2="120"/><line x1="386" y1="152" x2="674" y2="152"/>
    <line x1="386" y1="184" x2="674" y2="184"/><line x1="386" y1="216" x2="674" y2="216"/>
    <line x1="386" y1="248" x2="674" y2="248"/><line x1="386" y1="280" x2="674" y2="280"/>
    <line x1="386" y1="312" x2="674" y2="312"/><line x1="386" y1="344" x2="674" y2="344"/>
    <line x1="386" y1="56" x2="386" y2="344"/><line x1="418" y1="56" x2="418" y2="344"/>
    <line x1="450" y1="56" x2="450" y2="344"/><line x1="482" y1="56" x2="482" y2="344"/>
    <line x1="514" y1="56" x2="514" y2="344"/><line x1="546" y1="56" x2="546" y2="344"/>
    <line x1="578" y1="56" x2="578" y2="344"/><line x1="610" y1="56" x2="610" y2="344"/>
    <line x1="642" y1="56" x2="642" y2="344"/><line x1="674" y1="56" x2="674" y2="344"/>
  </g>
  <g fill="#8b6914">
    <circle cx="482" cy="152" r="3"/><circle cx="578" cy="152" r="3"/>
    <circle cx="482" cy="248" r="3"/><circle cx="578" cy="248" r="3"/>
    <circle cx="530" cy="200" r="4"/>
  </g>
  <defs>
    <radialGradient id="bk" cx="35%" cy="35%"><stop offset="0%" stop-color="#555"/><stop offset="100%" stop-color="#1a1a1a"/></radialGradient>
    <radialGradient id="wt" cx="35%" cy="35%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ccc"/></radialGradient>
  </defs>
  <circle cx="530" cy="200" r="12" fill="url(#bk)"/>
  <circle cx="498" cy="184" r="12" fill="url(#bk)"/>
  <circle cx="562" cy="216" r="12" fill="url(#wt)"/>
  <circle cx="530" cy="232" r="12" fill="url(#wt)"/>
  <circle cx="530" cy="200" r="3" fill="#c8902c"/>

  <text x="360" y="400" font-size="10" fill="#a89c82">示意图（实际界面以浏览器为准；部署后建议替换为真实截图）</text>
</svg>
